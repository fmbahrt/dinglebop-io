worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript;

    # The secret links are URL paths; keep them out of pod logs.
    access_log off;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;

        expires -1;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

        # The poster POC runs OpenCV.js: WebAssembly ('wasm-unsafe-eval') and embind's
        # new Function() ('unsafe-eval').
        # Only this page gets it. (add_header here replaces the server's, so all are repeated.)
        location = /plakat-poc.html {
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; img-src 'self' data: blob:; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
            try_files $uri =404;
        }

        # The intro (/0-<random>, the QR code) finds the poster with OpenCV.js in a
        # worker: both the page and the worker get 'wasm-unsafe-eval' + 'unsafe-eval'.
        location ~ "^/0-[A-Za-z0-9]{16,}/?$" {
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
            try_files /intro.html =404;
        }
        location = /plakat-worker.js {
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self'" always;
            try_files $uri =404;
        }

        location = /healthz {
            return 200 "ok\n";
        }

        # Letters, tasks, photos and videos: the real file or 404, never the index.html fallback.
        location ~* \.(txt|json|jpe?g|png|webp|gif|mp4|mov|webm)$ {
            charset utf-8;
            try_files $uri =404;
        }

        # Only the secret paths get the app: /<week folder> (app.js loads
        # /<folder>/brev.txt) and the front page /<hjem> (20 random characters;
        # app.js loads /<hjem>/portaler.json). "/" and anything else is a 404.
        location ~ "^/([1-4]-[A-Za-z0-9_-]{8,}|[A-Za-z0-9]{16,})/?$" {
            try_files /index.html =404;
        }
        location / {
            try_files $uri =404;
        }
    }
}
