worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript;

    # The secret links are URL paths; keep them out of pod logs.
    access_log off;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;

        expires -1;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

        location = /healthz {
            return 200 "ok\n";
        }

        # Letters, tasks, photos and videos: the real file or 404, never the index.html fallback.
        location ~* \.(txt|json|jpe?g|png|webp|gif|mp4|mov|webm)$ {
            charset utf-8;
            try_files $uri =404;
        }

        # /<week folder> -> index.html; app.js loads /<folder>/brev.txt.
        location / {
            try_files $uri /index.html;
        }
    }
}
