# advent.dinglebop.io — static advent calendar (projects/advent).
# The image only contains ciphertext; the keys live in the QR codes.
apiVersion: v1
kind: Service
metadata:
  name: advent
  namespace: advent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: advent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advent
  namespace: advent
  labels:
    app.kubernetes.io/name: advent
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: advent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Bump to the sha-<commit> tag pushed by .github/workflows/advent.yml.
          image: ghcr.io/fmbahrt/advent:sha-91bcf489b9da
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: advent
  namespace: advent
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: agentgateway
      sectionName: https-advent
  hostnames:
    - advent.dinglebop.io
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: advent
          port: 8080
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: advent-redirect-http-to-https
  namespace: advent
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: cluster-gateway
      namespace: agentgateway
      sectionName: http-public-subdomains
  hostnames:
    - advent.dinglebop.io
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
